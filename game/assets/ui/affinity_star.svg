<!--
  Affinity star. Replaces assets/bubbles/star_icon@2x.png, which came out of
  the dump AND was a 27x25 texture being upscaled into a 34x32 slot, so it
  arrived blurry. Godot rasterises this at import (see svg/scale in the
  .import), so it can be re-rendered sharp at whatever size the UI wants.

  Star outline from Font Awesome Free 7.3.1 (CC BY 4.0, Fonticons Inc.) -
  attribution is required if this ever ships publicly.

  Colours match the icon it replaces: #72d03b fill, white outline. The path is
  drawn twice rather than using paint-order, which ThorVG does not support: the
  first pass is a fat white stroke, the second lays the green fill over it, so
  the stroke reads as an outline sitting behind the star.
-->
